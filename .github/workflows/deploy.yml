name: Validate and deploy WordPress theme

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atus-production
  cancel-in-progress: false

jobs:
  validate:
    name: Validate theme
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          coverage: none

      - name: Check PHP syntax
        run: find . -type f -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l

      - name: Check required theme files
        run: |
          test -f style.css
          test -f functions.php
          test -f index.php
          grep -q '^Theme Name:' style.css

  deploy:
    name: Deploy production
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KEY_PASSPHRASE: ${{ secrets.DEPLOY_KEY_PASSPHRASE }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          : "${DEPLOY_HOST:?Missing DEPLOY_HOST secret}"
          : "${DEPLOY_USER:?Missing DEPLOY_USER secret}"
          : "${DEPLOY_PATH:?Missing DEPLOY_PATH secret}"
          : "${DEPLOY_SSH_KEY:?Missing DEPLOY_SSH_KEY secret}"
          : "${DEPLOY_KNOWN_HOSTS:?Missing DEPLOY_KNOWN_HOSTS secret}"
          case "$DEPLOY_PATH" in
            */wp-content/themes/*) ;;
            *) echo "DEPLOY_PATH must point to a directory inside wp-content/themes" >&2; exit 1 ;;
          esac

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts
          ssh-keygen -p -P "$DEPLOY_KEY_PASSPHRASE" -N '' -f ~/.ssh/deploy_key

      - name: Deploy theme files
        shell: bash
        run: |
          set -euo pipefail
          port="${DEPLOY_PORT:-22}"
          tar \
            --exclude-vcs \
            --exclude='.github' \
            --exclude='.deployignore' \
            --exclude='README.txt' \
            --exclude='*.zip' \
            --exclude='*.log' \
            --exclude='node_modules' \
            --exclude='vendor' \
            -czf - . | ssh \
              -i ~/.ssh/deploy_key \
              -p "$port" \
              -o BatchMode=yes \
              -o StrictHostKeyChecking=yes \
              "${DEPLOY_USER}@${DEPLOY_HOST}" \
              "mkdir -p '${DEPLOY_PATH%/}' && tar -xzf - -C '${DEPLOY_PATH%/}'"

      - name: Verify website
        if: ${{ env.HEALTHCHECK_URL != '' }}
        shell: bash
        run: curl --fail --silent --show-error --location --retry 3 --max-time 30 "$HEALTHCHECK_URL" > /dev/null
